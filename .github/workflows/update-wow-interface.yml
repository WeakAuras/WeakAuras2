name: Update WoW TOC Interface

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    if: github.repository == 'WeakAuras/WeakAuras2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: toc
        uses: Nnoggie/wow-interface-updater@aa3a90e8395f522b3fc1727646fa49738108aa39 # v1.3.0

      - uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8
        if: steps.toc.outputs.changed == 'true'
        with:
          branch: automation/wow-interface
          delete-branch: true
          commit-message: "chore: update WoW TOC interface versions"
          title: "chore: update WoW TOC interface versions"
          body: ${{ steps.toc.outputs.pr-body }}
